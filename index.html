<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pulse News delivers real-time global headlines in technology, business, sports, entertainment, health, and science. Stay updated instantly.">
<title>PULSE — Live News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface2: #1c1c1c; --border: #252525;
    --accent: #e8ff47; --text: #f0f0f0; --text-muted: #888; --text-dim: #444;
    --radius: 12px; --ease: cubic-bezier(0.4,0,0.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; min-height: 100vh; }
  ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
  a { text-decoration: none; color: inherit; }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 62px; background: rgba(10,10,10,0.9); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 clamp(14px,4vw,52px); gap: 16px; }
  .logo { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.55rem; letter-spacing: -0.5px; cursor: pointer; flex-shrink: 0; user-select: none; }
  .logo em { color: var(--accent); font-style: normal; }
  .nav-cats { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .nav-cats::-webkit-scrollbar { display: none; }
  .cat-btn { background: none; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); padding: 5px 13px; border-radius: 100px; cursor: pointer; white-space: nowrap; transition: background 0.2s, color 0.2s; }
  .cat-btn:hover { background: var(--surface2); color: var(--text); }
  .cat-btn.active { background: var(--accent); color: #000; font-weight: 700; }

  .search-wrap { position: relative; flex-shrink: 0; }
  .search-icon-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: border-color 0.2s, color 0.2s; }
  .search-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .search-panel { position: absolute; top: 50%; right: 0; transform: translateY(-50%) scaleX(0); transform-origin: right; display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--accent); border-radius: 100px; overflow: hidden; width: 250px; transition: transform 0.25s var(--ease); }
  .search-panel.open { transform: translateY(-50%) scaleX(1); }
  .search-panel input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.83rem; padding: 7px 15px; }
  .search-panel input::placeholder { color: var(--text-dim); }
  .search-panel button { background: none; border: none; color: var(--text-muted); padding: 7px 12px; cursor: pointer; font-size: 13px; }

  .ticker { margin-top: 62px; background: var(--accent); color: #000; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; overflow: hidden; white-space: nowrap; padding: 6px 0; }
  .ticker-track { display: inline-block; animation: tick 35s linear infinite; }
  .ticker-track span { margin: 0 36px; }
  .ticker-track span::before { content: '◆ '; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .page { max-width: 1300px; margin: 0 auto; padding: 0 clamp(14px,4vw,48px) 90px; }

  .sec-head { display: flex; align-items: center; gap: 14px; margin: 40px 0 22px; opacity: 0; transform: translateY(16px); transition: opacity 0.5s var(--ease), transform 0.5s var(--ease); }
  .sec-head.vis { opacity: 1; transform: none; }
  .sec-title { font-family: 'Playfair Display', serif; font-size: clamp(1.3rem,3vw,1.9rem); font-weight: 700; white-space: nowrap; }
  .sec-line { flex: 1; height: 1px; background: var(--border); }
  .sec-tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }

  .hero-grid { display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: 1fr 1fr; gap: 14px; min-height: 520px; }
  .hero-main { grid-row: 1 / 3; }
  .card-hero, .card-small { position: relative; border-radius: var(--radius); overflow: hidden; cursor: pointer; background: var(--surface); display: block; }
  .card-hero { height: 100%; min-height: 520px; }
  .card-small { min-height: 240px; }
  .card-hero img, .card-small img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease); }
  .card-hero:hover img, .card-small:hover img { transform: scale(1.05); }
  .card-grad { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.93) 0%, rgba(0,0,0,0.18) 58%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 22px; }
  .card-hero::after, .card-small::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(232,255,71,0.07) 0%, transparent 55%); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .card-hero:hover::after, .card-small:hover::after { opacity: 1; }

  .badge { display: inline-block; width: fit-content; font-size: 0.64rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 100px; margin-bottom: 9px; background: var(--accent); color: #000; }
  .badge.technology { background: #e8ff47; color: #000; } .badge.business { background: #f0a500; color: #000; }
  .badge.sports { background: #ff5733; color: #fff; } .badge.entertainment { background: #e040fb; color: #fff; }
  .badge.health { background: #00c853; color: #000; } .badge.science { background: #29b6f6; color: #000; } .badge.general { background: #666; color: #fff; }

  .card-title-hero { font-family: 'Playfair Display', serif; font-size: clamp(1.15rem,2.4vw,1.7rem); font-weight: 700; line-height: 1.22; margin-bottom: 8px; }
  .card-title-sm   { font-family: 'Playfair Display', serif; font-size: clamp(0.88rem,1.4vw,1rem); font-weight: 700; line-height: 1.3; margin-bottom: 5px; }
  .card-desc-txt   { font-size: 0.8rem; color: rgba(240,240,240,0.72); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-hero .card-desc-txt { -webkit-line-clamp: 3; }
  .card-meta-row   { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 0.72rem; color: var(--text-dim); }
  .card-meta-row .dot { width: 3px; height: 3px; background: var(--text-dim); border-radius: 50%; }
  .card-source { color: rgba(255,255,255,0.45); font-weight: 500; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 18px; }
  .card-grid-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; opacity: 0; transform: translateY(22px); transition: opacity 0.4s var(--ease), transform 0.4s var(--ease), border-color 0.2s, box-shadow 0.2s; }
  .card-grid-item.vis { opacity: 1; transform: translateY(0); }
  .card-grid-item:hover { transform: translateY(-5px); border-color: rgba(232,255,71,0.28); box-shadow: 0 18px 42px rgba(0,0,0,0.45); }
  .card-grid-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface2); transition: transform 0.5s var(--ease); }
  .card-grid-item:hover .card-grid-img { transform: scale(1.04); }
  .no-img { display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--text-dim); background: var(--surface2); aspect-ratio: 16/9; }
  .card-grid-body { padding: 16px; }
  .card-grid-body .card-title-sm { margin: 7px 0 7px; }
  .card-grid-body .card-desc-txt { color: var(--text-muted); margin-bottom: 13px; }

  .list-stack { display: flex; flex-direction: column; gap: 11px; }
  .card-list { display: flex; gap: 13px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px; cursor: pointer; opacity: 0; transform: translateX(-16px); transition: opacity 0.4s var(--ease), transform 0.4s var(--ease), border-color 0.2s; }
  .card-list.vis { opacity: 1; transform: none; }
  .card-list:hover { border-color: rgba(232,255,71,0.3); transform: translateX(5px); }
  .card-list-img { width: 86px; height: 68px; object-fit: cover; border-radius: 7px; flex-shrink: 0; background: var(--surface2); }
  .card-list-body { flex: 1; min-width: 0; }
  .card-list-body .badge { font-size: 0.58rem; padding: 2px 7px; }
  .card-list-body .card-title-sm { font-size: 0.85rem; margin: 5px 0 4px; }

  .card-feature { position: relative; border-radius: var(--radius); overflow: hidden; cursor: pointer; min-height: 400px; }
  .card-feature img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.65s var(--ease); }
  .card-feature:hover img { transform: scale(1.04); }
  .card-feature .card-title-sm { font-size: clamp(1rem,2vw,1.35rem); }
  .split-layout { display: grid; grid-template-columns: 1fr 330px; gap: 28px; align-items: start; }

  .spinner-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 18px; }
  .spinner { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-label { font-size: 0.85rem; color: var(--text-muted); }

  .msg-box { text-align: center; padding: 70px 20px; color: var(--text-dim); }
  .msg-box .icon { font-size: 2.8rem; margin-bottom: 14px; }
  .msg-box p { font-size: 0.95rem; line-height: 1.8; }
  .retry-btn { margin-top: 18px; display: inline-block; padding: 9px 22px; background: var(--accent); color: #000; font-weight: 700; font-size: 0.85rem; border-radius: 100px; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif; }

  .modal-bg { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.92); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; padding: 18px; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: modin 0.25s var(--ease); }
  @keyframes modin { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: none; } }
  .modal-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 16px 16px 0 0; display: block; background: var(--surface2); }
  .modal-body { padding: 26px; }
  .modal-body .badge { margin-bottom: 12px; }
  .modal-heading { font-family: 'Playfair Display', serif; font-size: clamp(1.2rem,3vw,1.75rem); font-weight: 700; line-height: 1.25; margin-bottom: 11px; }
  .modal-meta { display: flex; gap: 10px; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 18px; flex-wrap: wrap; }
  .modal-desc { font-size: 0.93rem; line-height: 1.78; color: rgba(240,240,240,0.82); }
  .modal-link { display: inline-flex; align-items: center; gap: 7px; margin-top: 20px; padding: 9px 18px; background: var(--accent); color: #000; font-size: 0.82rem; font-weight: 700; border-radius: 100px; transition: opacity 0.2s; }
  .modal-link:hover { opacity: 0.85; }
  .modal-close { position: absolute; top: 13px; right: 13px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.55); border: 1px solid var(--border); color: var(--text); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, color 0.2s; }
  .modal-close:hover { background: var(--accent); color: #000; }

  footer { border-top: 1px solid var(--border); padding: 36px clamp(14px,4vw,52px); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
  .f-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900; }
  .f-logo em { color: var(--accent); font-style: normal; }
  footer p { font-size: 0.76rem; color: var(--text-dim); }

  @media (max-width: 960px) { .hero-grid { grid-template-columns: 1fr 1fr; } .hero-main { grid-column: 1 / 3; grid-row: auto; } .card-hero { min-height: 300px; } .split-layout { grid-template-columns: 1fr; } }
  @media (max-width: 620px) { .hero-grid { grid-template-columns: 1fr; } .hero-main { grid-column: 1; } .nav-cats { display: none; } .logo { flex: 1; } .cards-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>PULSE Live News</h1>
<p>
PULSE is a live news website showing the latest global headlines in technology,
business, sports, entertainment, health, and science. Stay updated with real-time news.
</p>

<nav>
  <div class="logo" onclick="setCategory('general')">PULSE<em>.</em></div>
  <div class="nav-cats">
    <button class="cat-btn active" data-cat="general"       onclick="setCategory('general')">Top News</button>
    <button class="cat-btn"        data-cat="technology"    onclick="setCategory('technology')">Technology</button>
    <button class="cat-btn"        data-cat="business"      onclick="setCategory('business')">Business</button>
    <button class="cat-btn"        data-cat="sports"        onclick="setCategory('sports')">Sports</button>
    <button class="cat-btn"        data-cat="entertainment" onclick="setCategory('entertainment')">Entertainment</button>
    <button class="cat-btn"        data-cat="health"        onclick="setCategory('health')">Health</button>
    <button class="cat-btn"        data-cat="science"       onclick="setCategory('science')">Science</button>
  </div>
  <div class="search-wrap">
    <button class="search-icon-btn" onclick="toggleSearch()">🔍</button>
    <div class="search-panel" id="searchPanel">
      <input type="text" id="searchInput" placeholder="Search news…" onkeydown="onSearchKey(event)">
      <button onclick="doSearch()">→</button>
      <button onclick="closeSearch()">✕</button>
    </div>
  </div>
</nav>

<div class="ticker"><div class="ticker-track" id="tickerTrack">Loading headlines…</div></div>
<div class="page" id="page"></div>

<footer>
  <div class="f-logo">PULSE<em>.</em></div>
  <p>Powered by <a href="https://newsapi.org" style="color:var(--accent)">NewsAPI.org</a></p>
  <p>© 2026 Pulse News. All rights reserved.</p>
</footer>

<script>
const API_KEY     = '02c7aed595ec46cab41bb2be853adb9a';
const PLACEHOLDER = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800&q=70';

let currentCat    = 'general';
let searchMode    = false;
let searchTerm    = '';
let cache         = {};
let heroArticles  = [];

// ── RACE ALL PROXIES AT ONCE ───────────────────────────────
// Returns the first one that resolves with valid data.
// All 3 requests fire simultaneously — fastest wins.
function raceProxies(apiUrl) {
  const tryAllOrigins = () =>
    fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`)
      .then(r => r.json())
      .then(j => { const d = JSON.parse(j.contents); if (d.status !== 'ok') throw 0; return d; });

  const tryCorsProxy = () =>
    fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`)
      .then(r => r.json())
      .then(d => { if (d.status !== 'ok') throw 0; return d; });

  const tryThingProxy = () =>
    fetch(`https://thingproxy.freeboard.io/fetch/${apiUrl}`)
      .then(r => r.json())
      .then(d => { if (d.status !== 'ok') throw 0; return d; });

  // Promise.any resolves as soon as the FIRST one succeeds
  return Promise.any([tryAllOrigins(), tryCorsProxy(), tryThingProxy()]);
}

async function fetchNews(cat, q) {
  const key = q ? `q:${q}` : `cat:${cat}`;
  if (cache[key]) return cache[key];

  const apiUrl = q
    ? `https://newsapi.org/v2/everything?q=${encodeURIComponent(q)}&language=en&sortBy=publishedAt&pageSize=30&apiKey=${API_KEY}`
    : `https://newsapi.org/v2/top-headlines?category=${cat}&language=en&pageSize=30&apiKey=${API_KEY}`;

  try {
    const data = await raceProxies(apiUrl);
    const arts = (data.articles || []).filter(a => a.title && a.title !== '[Removed]' && a.url);
    cache[key] = arts;
    return arts;
  } catch {
    return null;
  }
}

// ── HELPERS ────────────────────────────────────────────────
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function timeAgo(d) {
  if (!d) return '';
  const m = Math.floor((Date.now() - new Date(d)) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m+'m ago';
  const h = Math.floor(m/60); if (h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function imgSrc(u) { return (u && !u.includes('removed')) ? u : PLACEHOLDER; }
function bdg(cat) {
  const c = (cat||'general').toLowerCase();
  const l = {general:'News',technology:'Tech',business:'Business',sports:'Sports',entertainment:'Entmt',health:'Health',science:'Science'};
  return `<span class="badge ${c}">${l[c]||'News'}</span>`;
}
function catFull(c) { return {general:'Top News',technology:'Technology',business:'Business',sports:'Sports',entertainment:'Entertainment',health:'Health',science:'Science'}[c]||c; }

function buildTicker(arts) {
  if (!arts?.length) return;
  const t = arts.slice(0,10).map(a=>`<span>${esc(a.title)}</span>`).join('');
  document.getElementById('tickerTrack').innerHTML = t+t;
}

function showSpinner() {
  document.getElementById('page').innerHTML =
    `<div class="spinner-wrap"><div class="spinner"></div><span class="spinner-label">Loading news…</span></div>`;
}
function showError() {
  document.getElementById('page').innerHTML =
    `<div class="msg-box"><div class="icon">📡</div><p>Could not reach news servers.<br>Check your connection and try again.</p><button class="retry-btn" onclick="retryLoad()">Try Again</button></div>`;
}
function retryLoad() { cache = {}; setCategory(currentCat); }

// ── RENDER ─────────────────────────────────────────────────
function renderPage(arts, cat) {
  const page = document.getElementById('page');
  if (!arts)        { showError(); return; }
  if (!arts.length) { page.innerHTML=`<div class="msg-box"><div class="icon">🔍</div><p>No articles found.</p></div>`; return; }

  buildTicker(arts);
  heroArticles = arts;

  const [h, s1, s2] = arts;
  const latest = arts.slice(3,11);
  const feat   = arts[11];
  const side   = arts.slice(12,16);

  // Hero
  let html = `
    <div class="sec-head vis">
      <h2 class="sec-title">${searchMode?'"'+esc(searchTerm)+'"':catFull(cat)}</h2>
      <div class="sec-line"></div>
      <span class="sec-tag">${arts.length} stories</span>
    </div>
    <div class="hero-grid">
      <div class="hero-main">
        <div class="card-hero" onclick="openModal(0)">
          <img src="${imgSrc(h.urlToImage)}" alt="${esc(h.title)}" loading="lazy" onerror="this.src='${PLACEHOLDER}'">
          <div class="card-grad">${bdg(cat)}<div class="card-title-hero">${esc(h.title)}</div><div class="card-desc-txt">${esc(h.description||'')}</div><div class="card-meta-row"><span class="card-source">${esc(h.source?.name||'')}</span><span class="dot"></span><span>${timeAgo(h.publishedAt)}</span></div></div>
        </div>
      </div>`;
  if(s1) html+=`<div class="card-small" onclick="openModal(1)"><img src="${imgSrc(s1.urlToImage)}" loading="lazy" onerror="this.src='${PLACEHOLDER}'" alt="${esc(s1.title)}"><div class="card-grad">${bdg(cat)}<div class="card-title-sm">${esc(s1.title)}</div><div class="card-meta-row"><span class="card-source">${esc(s1.source?.name||'')}</span><span class="dot"></span><span>${timeAgo(s1.publishedAt)}</span></div></div></div>`;
  if(s2) html+=`<div class="card-small" onclick="openModal(2)"><img src="${imgSrc(s2.urlToImage)}" loading="lazy" onerror="this.src='${PLACEHOLDER}'" alt="${esc(s2.title)}"><div class="card-grad">${bdg(cat)}<div class="card-title-sm">${esc(s2.title)}</div><div class="card-meta-row"><span class="card-source">${esc(s2.source?.name||'')}</span><span class="dot"></span><span>${timeAgo(s2.publishedAt)}</span></div></div></div>`;
  html+=`</div>`;

  // Latest grid
  if(latest.length) {
    html+=`<div class="sec-head" id="sh1"><h2 class="sec-title">Latest Stories</h2><div class="sec-line"></div><span class="sec-tag">${latest.length} articles</span></div><div class="cards-grid">`;
    latest.forEach((a,i)=>{
      html+=`<div class="card-grid-item" onclick="openModal(${i+3})" style="transition-delay:${i*40}ms">${a.urlToImage?`<img class="card-grid-img" src="${a.urlToImage}" loading="lazy" onerror="this.src='${PLACEHOLDER}'" alt="${esc(a.title)}">`:`<div class="card-grid-img no-img">📰</div>`}<div class="card-grid-body">${bdg(cat)}<div class="card-title-sm">${esc(a.title)}</div><div class="card-desc-txt">${esc(a.description||'')}</div><div class="card-meta-row"><span class="card-source">${esc(a.source?.name||'')}</span><span class="dot"></span><span>${timeAgo(a.publishedAt)}</span></div></div></div>`;
    });
    html+=`</div>`;
  }

  // More stories
  if(feat && side.length) {
    html+=`<div class="sec-head" id="sh2"><h2 class="sec-title">More Stories</h2><div class="sec-line"></div><span class="sec-tag">In Depth</span></div><div class="split-layout"><div class="card-feature" onclick="openModal(11)"><img src="${imgSrc(feat.urlToImage)}" loading="lazy" onerror="this.src='${PLACEHOLDER}'" alt="${esc(feat.title)}"><div class="card-grad">${bdg(cat)}<div class="card-title-sm">${esc(feat.title)}</div><div class="card-desc-txt">${esc(feat.description||'')}</div><div class="card-meta-row"><span class="card-source">${esc(feat.source?.name||'')}</span><span class="dot"></span><span>${timeAgo(feat.publishedAt)}</span></div></div></div><div class="list-stack">`;
    side.forEach((a,i)=>{ html+=`<div class="card-list" onclick="openModal(${12+i})"><img class="card-list-img" src="${imgSrc(a.urlToImage)}" loading="lazy" onerror="this.src='${PLACEHOLDER}'" alt="${esc(a.title)}"><div class="card-list-body">${bdg(cat)}<div class="card-title-sm">${esc(a.title)}</div><div class="card-meta-row"><span class="card-source">${esc(a.source?.name||'')}</span><span class="dot"></span><span>${timeAgo(a.publishedAt)}</span></div></div></div>`; });
    html+=`</div></div>`;
  }

  page.innerHTML = html;

  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target);} });
  },{threshold:0.07});
  page.querySelectorAll('.sec-head,.card-grid-item,.card-list').forEach(el=>io.observe(el));
}

// ── MODAL ──────────────────────────────────────────────────
function openModal(idx) {
  const a = heroArticles[idx]; if(!a) return;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal-box"><img class="modal-img" src="${imgSrc(a.urlToImage)}" onerror="this.src='${PLACEHOLDER}'" alt="${esc(a.title)}"><button class="modal-close" onclick="this.closest('.modal-bg').remove()">✕</button><div class="modal-body">${bdg(currentCat)}<h2 class="modal-heading">${esc(a.title)}</h2><div class="modal-meta"><span>${esc(a.source?.name||'Unknown')}</span>${a.author?`<span>·</span><span>${esc(a.author.split(',')[0].substring(0,40))}</span>`:''}<span>·</span><span>${timeAgo(a.publishedAt)}</span></div><p class="modal-desc">${esc(a.description||'No description available.')}</p>${a.content?`<p class="modal-desc" style="margin-top:12px;opacity:0.7">${esc(a.content.replace(/\[\+\d+ chars\]/,'…'))}</p>`:''}<a class="modal-link" href="${a.url}" target="_blank" rel="noopener noreferrer">Read Full Article ↗</a></div></div>`;
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg);
}

// ── CONTROLS ───────────────────────────────────────────────
async function setCategory(cat) {
  currentCat=cat; searchMode=false; searchTerm='';
  document.getElementById('searchInput').value='';
  closeSearch();
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  window.scrollTo({top:0,behavior:'smooth'});
  showSpinner();
  renderPage(await fetchNews(cat), cat);
}
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim(); if(!q) return;
  searchMode=true; searchTerm=q; closeSearch();
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  window.scrollTo({top:0,behavior:'smooth'});
  showSpinner();
  renderPage(await fetchNews(null,q), 'general');
}
function onSearchKey(e) { if(e.key==='Enter') doSearch(); }
function toggleSearch() {
  const p=document.getElementById('searchPanel'); p.classList.toggle('open');
  if(p.classList.contains('open')) setTimeout(()=>document.getElementById('searchInput').focus(),220);
}
function closeSearch() { document.getElementById('searchPanel').classList.remove('open'); }
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('searchPanel').classList.add('open');setTimeout(()=>document.getElementById('searchInput').focus(),220);}
  if(e.key==='Escape'){closeSearch();document.querySelector('.modal-bg')?.remove();}
});

// ── INIT ───────────────────────────────────────────────────
showSpinner();
fetchNews('general').then(arts=>renderPage(arts,'general'));
</script>
</body>
</html>
